<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>Deepstrike Alert Archive</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="map-panel">
      <div id="map" aria-label="历史无人机与导弹活动地图"></div>
      <div class="map-grid" aria-hidden="true"></div>

      <header class="hud-header">
        <div>
          <h1>DEEPSTRIKE / ALERT ARCHIVE</h1>
          <div id="dataStatus" class="hud-sub">LOADING ARCHIVE…</div>
        </div>
        <div id="archiveLamp" class="archive-lamp" title="当前回放时刻存在活动或警报"></div>
      </header>

      <div class="map-legend" aria-label="地图图例与路线控制">
        <span><i class="legend-region uav-alert"></i>无人机正式警报</span>
        <span><i class="legend-region uav-report"></i>无人机官方活动</span>
        <span><i class="legend-region missile-alert"></i>导弹正式警报</span>
        <span><i class="legend-region missile-report"></i>导弹官方活动</span>
        <span><i class="legend-border ukraine"></i>乌克兰国界</span>
        <span><i class="legend-border russia"></i>俄罗斯国界</span>
        <span><i class="legend-unlinked"></i>外圈：独立观测 / 未可靠并入路线</span>
        <button id="routeToggle" class="route-toggle is-on" type="button" aria-pressed="true">
          <i class="legend-route"></i><span class="route-toggle-label">示意无人机路线 ON · 0</span>
        </button>
        <div class="export-controls" aria-label="地图纯画面与图片导出">
          <button id="cleanViewButton" class="export-button" type="button" aria-pressed="false">CLEAN VIEW</button>
          <button id="exportPngButton" class="export-button export-primary" type="button">EXPORT PNG</button>
        </div>
        <small class="legend-note">可视化路线从进入俄罗斯区域几何的边界点开始，此后只在俄罗斯区域内绘制；候选线路优先穿过所选时间窗内有无人机活动的州，并尽量减少夹在相邻亮州之间的未亮州，同时奖励在亮州内较长的穿越距离。只有州级信息时仍使用低置信度州内代理点。路线和起点均为示意推断，不代表真实发射点或单机连续航迹。</small>
      </div>

      <aside id="detailPanel" class="detail-panel" hidden>
        <button id="detailClose" class="icon-button" type="button" aria-label="关闭">×</button>
        <div id="detailEyebrow" class="detail-eyebrow"></div>
        <h2 id="detailTitle"></h2>
        <div id="detailBody" class="detail-body"></div>
        <a id="detailSource" class="source-link" href="#" target="_blank" rel="noopener">官方原文 ↗</a>
      </aside>
    </section>

    <section class="control-panel">
      <div class="timeline-layout">
        <label class="date-control start-date">
          <span>START</span>
          <input id="dateStart" type="date">
        </label>

        <div class="timeline-stack">
          <div id="tickLayer" class="tick-layer"></div>
          <div id="eventBars" class="event-bars"></div>
          <div id="selectionBand" class="selection-band"></div>
          <div id="cumulativeBand" class="cumulative-band"></div>
          <div id="reportDots" class="report-dots"></div>
          <div class="dual-range">
            <input id="rangeStart" class="range range-start" type="range" min="0" max="1000" value="0" step="1" aria-label="回放开始时间">
            <input id="rangeEnd" class="range range-end" type="range" min="0" max="1000" value="1000" step="1" aria-label="回放结束时间">
            <input id="rangeCumulative" class="range range-cumulative" type="range" min="0" max="1000" value="0" step="1" aria-label="累计观察指针">
          </div>
          <div id="handleStart" class="handle-label handle-start"></div>
          <div id="handleEnd" class="handle-label handle-end"></div>
          <div id="handleCumulative" class="handle-label handle-cumulative"></div>
        </div>

        <label class="date-control end-date">
          <span>END</span>
          <input id="dateEnd" type="date">
        </label>
      </div>

      <div class="playback-row">
        <button id="playButton" class="play-button" type="button">▶ PLAY</button>
        <div class="scrub-area">
          <input id="scrubber" type="range" min="0" max="1000" value="0" step="1" aria-label="当前回放时间">
          <div id="currentTimeLabel" class="current-time-label"></div>
        </div>
        <select id="speedSelect" class="speed-select" aria-label="回放速度">
          <option value="15">15 min/s</option>
          <option value="30" selected>30 min/s</option>
          <option value="60">60 min/s</option>
          <option value="180">180 min/s</option>
        </select>
      </div>

      <div class="clock-row">
        <div class="clock"><span>МОСКВА</span><strong id="clockMoscow">—</strong></div>
        <div class="clock"><span>КИЇВ</span><strong id="clockKyiv">—</strong></div>
        <div class="clock"><span>北京</span><strong id="clockBeijing">—</strong></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
