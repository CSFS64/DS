name: Telegram API Test

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Public Telegram channel username or t.me URL"
        required: true
        type: string

      limit:
        description: "Number of recent messages to read"
        required: true
        default: "10"
        type: string

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon

      - name: Test Telegram API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TEST_CHANNEL: ${{ inputs.channel }}
          TEST_LIMIT: ${{ inputs.limit }}
        run: |
          python scripts/test_telegram_api.py
