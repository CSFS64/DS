name: Update delayed archive data

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Archive window before the 24h safety lag"
        required: false
        default: "120"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: delayed-archive-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Build / refresh nationwide city catalog
        shell: bash
        run: |
          set +e
          python scripts/build_city_catalog.py --output data/cities.json
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "City catalog refresh failed; preserving any existing data/cities.json"
          fi
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Collect official delayed records
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '120' }}
          SAFETY_LAG_HOURS: "24"
          TELEGRAM_MAX_PAGES: "80"
        run: python collector/collect.py
      - name: Commit archive and catalog
        shell: bash
        run: |
          if git diff --quiet -- data/events.json data/cities.json; then
            echo "No archive/catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if [ -f data/cities.json ]; then git add data/cities.json; fi
          git commit -m "data: refresh delayed archive and place catalog"
          git pull --rebase origin main
          git push
