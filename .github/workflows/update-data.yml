name: Update delayed archive data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Incremental pulls from cursor to now; replay_previous re-runs the last exact window; backfill uses backfill_hours"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - replay_previous
          - backfill
      backfill_hours:
        description: "Hours to re-fetch when mode=backfill or on the very first run"
        required: false
        default: "168"
permissions:
  contents: write

concurrency:
  group: delayed-archive-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Build / refresh nationwide city catalog
        shell: bash
        run: |
          set +e
          python scripts/build_city_catalog.py --output data/cities.json
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "City catalog refresh failed; preserving any existing data/cities.json"
          fi
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Collect official delayed records
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.backfill_hours || '168' }}
          FULL_BACKFILL: ${{ github.event.inputs.mode == 'backfill' && '1' || '0' }}
          REPLAY_PREVIOUS_WINDOW: ${{ github.event.inputs.mode == 'replay_previous' && '1' || '0' }}
          INCREMENTAL_OVERLAP_HOURS: "0"
          SAFETY_LAG_HOURS: "0"
          TELEGRAM_MAX_PAGES: "80"
          TELEGRAM_CONTEXT_HOURS: "48"
          TELEGRAM_MT_MAX_MESSAGES: "20000"
          TELEGRAM_RESOLVE_DELAY_SECONDS: "5"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python collector/collect.py
      - name: Summarize source health
        if: always()
        shell: bash
        run: python scripts/source_health_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit archive and catalog
        shell: bash
        run: |
          if git diff --quiet -- data/events.json data/cities.json data/telegram_peers.json; then
            echo "No archive/catalog/peer-cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if [ -f data/cities.json ]; then git add data/cities.json; fi
          if [ -f data/telegram_peers.json ]; then git add data/telegram_peers.json; fi
          git commit -m "data: refresh delayed archive and place catalog"
          git pull --rebase origin main
          git push
