name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Best-effort vendoring of one ADM1 GeoJSON into the Pages artifact.
      # IMPORTANT: boundary download failure must never block the whole site deploy.
      - name: Fetch regional boundaries
        shell: bash
        run: |
          set -u
          mkdir -p data
          rm -f data/russia.geojson data/russia.geojson.tmp

          candidates=(
            "https://raw.githubusercontent.com/rnekrasov-msk/geojson/master/admin_level_1.geojson"
            "https://raw.githubusercontent.com/imsha/russia_geojson_regions_2021/main/ru.json"
            "https://raw.githubusercontent.com/antibioticbook/russian-geo-data/master/geo.json"
            "https://raw.githubusercontent.com/rnekrasov-msk/geojson/master/regions.geojson"
          )

          ok=0
          for url in "${candidates[@]}"; do
            echo "Trying boundary source: $url"
            if curl -L --fail --retry 2 --connect-timeout 12 --max-time 60 "$url" -o data/russia.geojson.tmp; then
              if python - <<'PY'
          import json, sys
          p='data/russia.geojson.tmp'
          try:
              with open(p, encoding='utf-8') as f:
                  d=json.load(f)
              features=d.get('features', []) if isinstance(d, dict) else []
              good=(d.get('type')=='FeatureCollection' and len(features)>=70)
              print(f"candidate type={d.get('type')!r}, features={len(features)}")
              raise SystemExit(0 if good else 1)
          except Exception as e:
              print('candidate validation failed:', repr(e))
              raise SystemExit(1)
          PY
              then
                mv data/russia.geojson.tmp data/russia.geojson
                ok=1
                echo "Boundary source accepted."
                break
              fi
            fi
            rm -f data/russia.geojson.tmp
          done

          if [ "$ok" -eq 1 ]; then
            python - <<'PY'
          import json
          with open('data/russia.geojson', encoding='utf-8') as f:
              d=json.load(f)
          print('vendored region features:', len(d.get('features', [])))
          PY
          else
            echo "::warning::No ADM1 boundary source passed validation; deploying without vendored russia.geojson. The frontend will use its runtime fallbacks / configured-region fallback markers."
            rm -f data/russia.geojson data/russia.geojson.tmp
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
