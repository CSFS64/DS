name: Test collector

on:
  push:
    paths:
      - "collector/**"
      - "tests/**"
      - "data/sources.json"
      - "data/ukraine-regions.geojson"
      - "js/**"
      - "index.html"
      - "css/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "collector/**"
      - "tests/**"
      - "data/sources.json"
      - "data/ukraine-regions.geojson"
      - "js/**"
      - "index.html"
      - "css/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/route-animation.js
          node --check js/video-export.js
      - name: Test static routes, animated waves and video branding
        run: node --test tests/test_route_playback.cjs tests/test_route_waves.cjs tests/test_branding.cjs
      - name: Validate detailed Ukraine GeoJSON
        run: python -m json.tool data/ukraine-regions.geojson > /dev/null
