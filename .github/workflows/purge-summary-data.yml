name: Purge archive aggregate summaries

on:
  push:
    branches: ["main"]
    paths:
      - "collector/collect.py"
      - "scripts/purge_aggregate_summaries.py"
      - ".github/workflows/purge-summary-data.yml"
  workflow_dispatch:

permissions:
  contents: write

# Share the update-data mutex so the collector cannot re-add stale rows
# between the cleanup job's checkout and push.
concurrency:
  group: delayed-archive-update
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      - name: Delete aggregate recaps from tracked history
        shell: bash
        run: |
          python scripts/purge_aggregate_summaries.py | tee purge.log
          cat purge.log >> "$GITHUB_STEP_SUMMARY"
      - name: Commit cleaned data/events.json
        shell: bash
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No existing summary records require removal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "data: delete old aggregate summaries and retrospective false alerts"
          git pull --rebase origin main
          git push origin HEAD:main
